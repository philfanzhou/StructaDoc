name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore StructaDoc.slnx

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Build web workspace
        working-directory: web
        run: npm run build

      - name: Build .NET solution
        run: dotnet build StructaDoc.slnx --configuration Release --no-restore

      - name: Run tests that do not require Docker
        run: >-
          dotnet test StructaDoc.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFilePrefix=unit"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  database-contracts:
    name: PostgreSQL, MySQL, and MariaDB contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STRUCTADOC_RUN_DATABASE_CONTRACT_TESTS: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore database contract test dependencies
        run: dotnet restore tests/StructaDoc.DatabaseContractTests/StructaDoc.DatabaseContractTests.csproj

      - name: Run contracts against real database containers
        run: >-
          dotnet test tests/StructaDoc.DatabaseContractTests/StructaDoc.DatabaseContractTests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=database-contracts.trx"
          --results-directory artifacts/database-contract-results

      - name: Upload database contract results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: database-contract-results
          path: artifacts/database-contract-results
          if-no-files-found: ignore

  container-and-browser:
    name: Production container and browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STRUCTADOC_E2E_ADMIN_USERNAME: structadoc-admin
      STRUCTADOC_E2E_ADMIN_PASSWORD: StructaDoc-${{ github.run_id }}-${{ github.run_attempt }}
      STRUCTADOC_E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser test dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build production image
        run: docker build --tag structadoc:ci .

      - name: Start production container
        run: |
          docker run --detach --name structadoc-ci \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --tmpfs /tmp:size=256m,mode=1777 \
            --publish 127.0.0.1:8080:8080 \
            --env Authentication__BootstrapAdministratorUsername="$STRUCTADOC_E2E_ADMIN_USERNAME" \
            --env Authentication__BootstrapAdministratorPassword="$STRUCTADOC_E2E_ADMIN_PASSWORD" \
            --env Worker__ExecutionEnabled=true \
            structadoc:ci

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done

          docker logs structadoc-ci
          exit 1

      - name: Verify live and system endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/system/info

      # A forwarded header from a peer no deployment named must not be believed, and the published
      # image has to read the section that decides that. The service reports the refusal with the
      # address it saw, which is the only observable this has from outside the container -- and the
      # last configuration-inside-the-image defect was exactly one the unit tests could not see.
      - name: Verify forwarded headers are refused from an unnamed peer
        run: |
          curl --fail --silent --show-error \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/health/live

          for attempt in {1..15}; do
            if docker logs structadoc-ci 2>&1 | grep --quiet 'ReverseProxy:TrustedProxies'; then
              exit 0
            fi
            sleep 1
          done

          echo 'The container did not report the refused X-Forwarded-Proto header.'
          docker logs structadoc-ci
          exit 1

      - name: Run browser workspace contract
        working-directory: web
        run: npm run test:e2e

      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-results
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Capture container logs
        if: always()
        run: docker logs structadoc-ci > structadoc-container.log 2>&1 || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-logs
          path: structadoc-container.log
          if-no-files-found: ignore

      - name: Stop production container
        if: always()
        run: docker rm --force structadoc-ci >/dev/null 2>&1 || true

  publish-image:
    name: Publish image to GitHub Container Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only what already passed everything. The container job builds this same image and runs a
    # browser flow against it, so an image that reaches the registry is one that started, answered
    # readiness, and served the workspace. Publishing ahead of that would mean the newest tag is the
    # least tested thing in the registry.
    needs: [build-and-test, database-contracts, container-and-browser]
    # A pull request builds the image in the job above and stops there: a fork's token cannot write
    # packages, and a branch nobody has merged is not what `latest` means.
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      # Signing the image without a stored key: the identity is this workflow, and the token that
      # proves it lives as long as the job does.
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # A registry path is lowercase and this repository's name is not. The tag builder would fix
      # that on its own; the attestation below takes the name as given.
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Sign in to the registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the default branch, every commit keeps a tag of its own so a deployment can
      # name exactly what it runs, and a `v*` tag publishes the release series it belongs to.
      - name: Decide tags
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=StructaDoc
            org.opencontainers.image.description=Document parsing and structured result service in one container.

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # A second build rather than a promotion of the image the container job tested: that job
          # runs in parallel and keeps its image on its own runner. The layer cache carries across
          # runs of this job, which is what keeps the LibreOffice install off the critical path.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # What the deployment documentation already asks of a release build: say where every layer came
      # from and keep the record. This one is attached to the image rather than to a log file.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
