name: CI

on:
  # A branch with a pull request open on it was building twice, once for the push and once for the
  # pull request, because the two events land in different concurrency groups and neither cancels
  # the other. The pull request is the run whose result is reported, so the push trigger is left
  # holding only what no pull request covers: the default branch, and the release tags that decide
  # what `publish-image` names the image.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  # Split out of `build-and-test`, where it sat ahead of the .NET build and ended the job before a
  # single project compiled. An advisory is published on the security world's clock rather than this
  # repository's, so the day one lands every open branch turns red at once, and not one of them has
  # been built, let alone tested. Kept apart the two failures stay readable: this job going red says
  # the supply chain moved underneath us, `build-and-test` going red says the change under review
  # broke something, and neither answer hides the other any more.
  audit-web:
    name: Web dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # No install precedes this and none is needed: `npm audit` resolves the dependency tree out of
      # package-lock.json, which is also the file that decides the answer. Skipping the install is
      # what keeps a gate this job exists to run cheap enough to run on its own.
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high

  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore StructaDoc.slnx

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web workspace
        working-directory: web
        run: npm run build

      - name: Build .NET solution
        run: dotnet build StructaDoc.slnx --configuration Release --no-restore

      # xunit v3 runs on Microsoft.Testing.Platform, which the .NET 10 SDK drives in place of
      # VSTest, so the report is asked for by name rather than through a `--logger` string. Each
      # test project is its own executable now and writes its own file into the results
      # directory, which is why no prefix or file name is supplied here.
      - name: Run tests that do not require Docker
        run: >-
          dotnet test StructaDoc.slnx
          --configuration Release
          --no-build
          --no-restore
          --report-trx
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  database-contracts:
    name: PostgreSQL, MySQL, and MariaDB contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STRUCTADOC_RUN_DATABASE_CONTRACT_TESTS: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore database contract test dependencies
        run: dotnet restore tests/StructaDoc.DatabaseContractTests/StructaDoc.DatabaseContractTests.csproj

      - name: Run contracts against real database containers
        run: >-
          dotnet test tests/StructaDoc.DatabaseContractTests/StructaDoc.DatabaseContractTests.csproj
          --configuration Release
          --no-restore
          --report-trx
          --results-directory artifacts/database-contract-results

      - name: Upload database contract results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: database-contract-results
          path: artifacts/database-contract-results
          if-no-files-found: ignore

  container-and-browser:
    name: Production container and browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STRUCTADOC_E2E_ADMIN_USERNAME: structadoc-admin
      STRUCTADOC_E2E_ADMIN_PASSWORD: StructaDoc-${{ github.run_id }}-${{ github.run_attempt }}
      STRUCTADOC_E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser test dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build production image
        run: >-
          docker build --tag structadoc:ci
          --build-arg SOURCE_REVISION="$GITHUB_SHA"
          .

      - name: Start production container
        run: |
          docker run --detach --name structadoc-ci \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --tmpfs /tmp:size=256m,mode=1777 \
            --publish 127.0.0.1:8080:8080 \
            --env Authentication__BootstrapAdministratorUsername="$STRUCTADOC_E2E_ADMIN_USERNAME" \
            --env Authentication__BootstrapAdministratorPassword="$STRUCTADOC_E2E_ADMIN_PASSWORD" \
            structadoc:ci

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done

          docker logs structadoc-ci
          exit 1

      - name: Verify live and system endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live

          info=$(curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/system/info)
          echo "$info"

          # Which build is running has to be answerable over HTTP, because the operator asking is
          # usually the one who cannot reach the machine. Nothing inside the image can work this out
          # on its own: .dockerignore excludes .git, so the SourceLink the SDK ships finds no
          # repository and stamps nothing. The build argument is the only carrier, and a version that
          # cannot name its own commit is exactly what this catches.
          case "$info" in
            *"+$GITHUB_SHA"*) ;;
            *)
              echo "system/info did not report the commit that built the image."
              exit 1
              ;;
          esac

      # A forwarded header from a peer no deployment named must not be believed, and the published
      # image has to read the section that decides that. The service reports the refusal with the
      # address it saw, which is the only observable this has from outside the container -- and the
      # last configuration-inside-the-image defect was exactly one the unit tests could not see.
      - name: Verify forwarded headers are refused from an unnamed peer
        run: |
          curl --fail --silent --show-error \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/health/live

          for attempt in {1..15}; do
            if docker logs structadoc-ci 2>&1 | grep --quiet 'ReverseProxy:TrustedProxies'; then
              exit 0
            fi
            sleep 1
          done

          echo 'The container did not report the refused X-Forwarded-Proto header.'
          docker logs structadoc-ci
          exit 1

      - name: Run browser workspace contract
        working-directory: web
        run: npm run test:e2e

      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-results
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Capture container logs
        if: always()
        run: docker logs structadoc-ci > structadoc-container.log 2>&1 || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-logs
          path: structadoc-container.log
          if-no-files-found: ignore

      - name: Stop production container
        if: always()
        run: docker rm --force structadoc-ci >/dev/null 2>&1 || true

  publish-image:
    name: Publish image to GitHub Container Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only what already passed everything. The container job builds this same image and runs a
    # browser flow against it, so an image that reaches the registry is one that started, answered
    # readiness, and served the workspace. Publishing ahead of that would mean the newest tag is the
    # least tested thing in the registry.
    #
    # The audit is listed for the same reason even though it compiles nothing. It moved out of
    # `build-and-test` and would otherwise have quietly stopped gating anything, which is the one
    # way this split could have made the pipeline weaker: an image carrying a high-severity advisory
    # is exactly what should not acquire a registry tag.
    needs: [audit-web, build-and-test, database-contracts, container-and-browser]
    # Two things publish and they publish different kinds of name. A release tag produces the names a
    # deployment is pinned to. A push to the default branch produces `edge`, which is one mutable name
    # meaning whatever `main` currently is; it exists so that a change can be pulled and tried before
    # anyone has decided on a version for it. A pull request publishes nothing, and could not in any
    # case, since a fork's token cannot write packages.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
      # Signing the image without a stored key: the identity is this workflow, and the token that
      # proves it lives as long as the job does.
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      # A registry path is lowercase and this repository's name is not. The tag builder would fix
      # that on its own; the attestation below takes the name as given.
      - name: Name the image
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          # Empty for anything that is not a release tag. The Dockerfile treats an empty VERSION as
          # absent and keeps the placeholder Directory.Build.props declares, which is why `edge`
          # reports `0.0.0-dev`: no release named a version for it, so it does not claim one.
          version=''
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Sign in to the registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is gated on the tag rather than left unconditional, and that gate is what keeps the
      # default branch from taking it. Whoever pulls `latest` is whoever did not choose a tag, and
      # handing them a build no release named would be handing them a development build they never
      # asked for.
      #
      # `edge` is the opposite kind of name and is meant to move. It is overwritten by every push to
      # `main`, which is what makes it usable for trying a change and useless for a deployment. The
      # semver rules below produce nothing on a branch push, so `main` publishes `edge` alone.
      #
      # There is still no `sha-<commit>` rule. The branch build is back but the per-commit name is
      # not: it left one permanent tag per push in a public registry and the old ones were never
      # pulled again. A deployment that named a commit names a version, or a digest, which is the
      # only immutable name in any case.
      - name: Decide tags
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # The action adds `latest` to a semver tag on its own, which would leave two rules naming
          # it and the release log listing it twice. One rule owns it, and it is the one written
          # here next to the reasoning for it.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=StructaDoc
            org.opencontainers.image.description=Document parsing and structured result service in one container.

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # What the running service answers to /api/v1/system/info. An empty VERSION leaves the
          # placeholder; the commit is always carried.
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          # A second build rather than a promotion of the image the container job tested: that job
          # runs in parallel and keeps its image on its own runner. The layer cache carries across
          # runs of this job, which is what keeps the LibreOffice install off the critical path.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # What the deployment documentation already asks of a release build: say where every layer came
      # from and keep the record. This one is attached to the image rather than to a log file.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A release announces an image. Creating it first would name a version that the container build
    # might still fail to produce, and a release whose `docker pull` line does not resolve is worse
    # than a release that arrives a few minutes later.
    needs: [publish-image]
    # Load-bearing rather than a restatement of `needs`: the job above runs for the default branch
    # too, so this is what keeps a push to `main` from announcing a release. Only a tag names one.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No checkout: everything below addresses the repository through the API, and the release notes
      # are generated by GitHub from the history it already has.
      - name: Write the release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            --field tag_name="$tag" --jq .body)

          # The image line goes above the generated notes rather than after them. A reader who opens
          # a release is usually looking for the thing to pull, and a list of merged pull requests is
          # not it.
          {
            printf '## Container image\n\n'
            printf '```bash\ndocker pull ghcr.io/%s:%s\n```\n\n' "${GITHUB_REPOSITORY,,}" "${tag#v}"
            printf '%s\n' "$notes"
          } > release-notes.md

      # Written to tolerate a second attempt. The publish job above has failed on a transient
      # registry error before, and the recovery for that is re-running the tag -- which must not then
      # fail on a release the first attempt had already created.
      - name: Publish the release
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
          fi
