name: structadoc

services:
  structadoc:
    image: structadoc:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_REGISTRY: ${STRUCTADOC_DOTNET_REGISTRY:-mcr.microsoft.com/dotnet}
        NUGET_SOURCE: ${STRUCTADOC_NUGET_SOURCE:-https://api.nuget.org/v3/index.json}
        APT_MIRROR: ${STRUCTADOC_APT_MIRROR:-}
        APT_PORTS_MIRROR: ${STRUCTADOC_APT_PORTS_MIRROR:-}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    environment:
      Authentication__BootstrapAdministratorEmail: ${STRUCTADOC_ADMIN_EMAIL:?Set STRUCTADOC_ADMIN_EMAIL}
      Authentication__BootstrapAdministratorPassword: ${STRUCTADOC_ADMIN_PASSWORD:?Set STRUCTADOC_ADMIN_PASSWORD}
      Authentication__BootstrapAdministratorDisplayName: ${STRUCTADOC_ADMIN_DISPLAY_NAME:-StructaDoc Administrator}
      Worker__ExecutionEnabled: ${STRUCTADOC_EXECUTION_ENABLED:-false}
    volumes:
      - structadoc-data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 1m

volumes:
  structadoc-data:
