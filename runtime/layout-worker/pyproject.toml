[project]
name = "structadoc-layout-worker"
version = "0.1.0"
description = "Optional StructaDoc layout inference worker: the MinerU SDK layout path behind the merged wire contract."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Server stack. Exact versions are pinned by uv.lock; the bounds here
    # state the compatibility window the application is written against.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pillow>=11,<13",
]

[dependency-groups]
# The inference engine: the official MinerU SDK client plus the in-process
# llama.cpp backend. The heavy `mineru` pipeline package (the torch
# full-parsing stack) is deliberately absent — see the deployment guide.
engine = [
    "mineru-vl-utils==2.0.7",
    "mineru-llama-cpp==0.1.3",
]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["structadoc_layout_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
